# file: postgresql/tasks/install_apt.yml
# Purpose: Install PostgreSQL from PGDG on Debian/Ubuntu in a future-proof way
# Notes:
# - No use of deprecated top-level facts (uses ansible_facts[...] instead)
# - No use of the deprecated apt_key/apt_repository modules; the PGDG
#   repository is managed with deb822_repository (apt >= 2.4, i.e. Debian
#   12+ / Ubuntu 22.04+)
# - Uses HTTPS and a signed-by keyring to satisfy apt-secure
# - Adds default_release only when the PGDG repository is configured

# --- Pre-reqs for HTTPS and deb822 support ---
# deb822_repository downloads the repository key and writes the .sources file
# itself; it only needs python3-debian on the target host.
- name: Ensure APT HTTPS/key prerequisites are present
  ansible.builtin.apt:
    name:
      - ca-certificates
      - lsb-release
      - python3-debian
    state: present
    update_cache: true
  when: ansible_facts['pkg_mgr'] == 'apt'

# --- Derive the PGDG suite from the host codename ---
# Examples: bookworm -> bookworm-pgdg, trixie -> trixie-pgdg, jammy -> jammy-pgdg, noble -> noble-pgdg
- name: Compute PGDG suite from distribution codename
  ansible.builtin.set_fact:
    postgresql_apt_suite: "{{ ansible_facts['distribution_release'] }}-pgdg"
  when: ansible_facts['pkg_mgr'] == 'apt'

# --- Remove old repository files ---
# Earlier versions of this role wrote a one-line entry to pgdg.list (or an
# auto-named sources.list file). deb822_repository writes pgdg.sources, so
# remove the legacy files to avoid defining the same repository twice.
- name: PostgreSQL | Remove old PostgreSQL repository | apt
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop:
    - pgdg.list
    - apt_postgresql_org_pub_repos_apt.list
    - apt_postgresql_org_pub_repos_apt.sources
  when:
    - ansible_facts['pkg_mgr'] == 'apt'
    - (postgresql_install_repository | default(true)) | bool

# --- Add the PGDG APT repository (HTTPS + signed-by) ---
# deb822_repository downloads the ASCII-armored key, stores it with the .asc
# extension and references it through Signed-By.
- name: Add PGDG APT repository
  ansible.builtin.deb822_repository:
    name: pgdg
    types:
      - deb
    uris: "{{ postgresql_apt_repo_base }}"
    suites: "{{ postgresql_apt_suite }}"
    components: "{{ postgresql_apt_repo_components }}"
    signed_by: "{{ postgresql_apt_key_url }}"
    state: present
  register: postgresql_apt_pgdg_repo
  when:
    - ansible_facts['pkg_mgr'] == 'apt'
    - (postgresql_install_repository | default(true)) | bool

# deb822_repository does not refresh the package lists. The install tasks
# below use cache_valid_time, which may skip a refresh on a fresh host, so
# refresh explicitly whenever the repository definition changed.
- name: Refresh APT cache after adding the PGDG repository
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_facts['pkg_mgr'] == 'apt'
    - (postgresql_install_repository | default(true)) | bool
    - postgresql_apt_pgdg_repo is changed

# --- Optional pinning (preferences) ---
- name: Add APT preferences for PGDG (pinning)
  ansible.builtin.template:
    src: etc_apt_preferences.d_apt_postgresql_org_pub_repos_apt.pref.j2
    dest: /etc/apt/preferences.d/apt_postgresql_org_pub_repos_apt.pref
  when:
    # cast to int, compare => boolean
    - (postgresql_apt_pin_priority | default(0) | int) > 0
    - (postgresql_install_repository | default(true)) | bool

# --- Ensure role-level APT dependencies are present ---
# This is where you can ensure build or runtime deps required before installing PostgreSQL.
- name: Ensure role APT dependencies are installed
  ansible.builtin.apt:
    name: "{{ postgresql_apt_dependencies | default([]) }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ apt_cache_valid_time | default(3600) }}"
  when:
    - ansible_facts['pkg_mgr'] == 'apt'
    - (postgresql_apt_dependencies | default([])) | length > 0

# --- Install PostgreSQL packages ---
# Pin the PGDG suite with default_release only when the PGDG repository is configured: with
# postgresql_install_repository: false (distribution packages), APT does not know the suite and fails with
# "The value '<codename>-pgdg' is invalid for APT::Default-Release".
- name: Install PostgreSQL server/client/contrib
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgresql_version }}"
      - "postgresql-client-{{ postgresql_version }}"
      - "postgresql-contrib-{{ postgresql_version }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ apt_cache_valid_time | default(3600) }}"
    default_release: >-
      {{ postgresql_default_release
         | default(postgresql_apt_suite
                   if (postgresql_install_repository | default(true)) | bool
                   else omit) }}
  environment: "{{ postgresql_env | default({}) }}"
  when: ansible_facts['pkg_mgr'] == 'apt'

# --- Optional: install pgtune from PGDG ---
# Only if your role enables pgtune.
- name: Install pgtune
  ansible.builtin.apt:
    name: pgtune
    state: present
    update_cache: true
    cache_valid_time: "{{ apt_cache_valid_time | default(3600) }}"
  environment: "{{ postgresql_env | default({}) }}"
  when:
    - ansible_facts['pkg_mgr'] == 'apt'
    - (postgresql_pgtune | default(false)) | bool
